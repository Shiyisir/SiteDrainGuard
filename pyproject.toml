[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitedrainguard"
version = "0.1.0"
description = "Synthetic construction-site stormwater scenario analysis with EPA SWMM and PySWMM."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Shiyisir"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "plotly>=5.18,<7",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "pyswmm==2.1.0",
  "streamlit>=1.37,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<8",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "integration: tests that execute the real SWMM engine",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
branch = true
source = ["sitedrainguard"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
